    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    pos = 0; solved = 0; render();
  });
  render();
};

// ================= SHAXSIY SEYF =================
// Shifrlash: AES-256-GCM. Kalit master paroldan PBKDF2-SHA256 (600 000 iteratsiya) bilan olinadi.
// Brauzer xotirasida faqat shifrlangan blok saqlanadi. Ochiq matn hech qachon diskka yozilmaydi.
(() => {
  const STORE = "kiber-seyf-v1", FAILS = "kiber-seyf-fails", META = "kiber-seyf-meta";
  const ITER = 600000, AAD = new TextEncoder().encode("kiber-seyf-v1");
  const IDLE_MS = 5 * 60 * 1000, HIDDEN_MS = 60 * 1000, CLIP_MS = 30 * 1000;
  const te = new TextEncoder(), td = new TextDecoder();

  // ---------- Kichik yordamchilar ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch {} },
    ok() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch { return false; } },
  };
  const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  // Xavfsiz DOM: hamma matn textContent orqali qo'yiladi, innerHTML ishlatilmaydi
  function h(tag, props = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k in el && k !== "list") el[k] = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }

  // ---------- Kriptografiya ----------
  async function deriveKey(pw, salt, iter) {
    const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(key, salt, iter, data) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, key, te.encode(JSON.stringify(data))));
    return { app: "kiber-seyf", v: 1, kdf: "PBKDF2-SHA256", iter, salt: b64(salt), iv: b64(iv), ct: b64(ct), saved: new Date().toISOString() };
  }
  async function unseal(blob, pw) {
    const salt = unb64(blob.salt), key = await deriveKey(pw, salt, blob.iter);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv), additionalData: AAD }, key, unb64(blob.ct));
    return { key, salt, iter: blob.iter, data: JSON.parse(td.decode(pt)) };
  }
  function validBlob(b) {
    return b && b.app === "kiber-seyf" && b.v === 1 && Number.isInteger(b.iter) && b.iter >= 100000 && [b.salt, b.iv, b.ct].every((x) => typeof x === "string");
  }
  function randInt(max) { // modulo bias'siz tasodifiy son
    const lim = Math.floor(0x100000000 / max) * max, a = new Uint32Array(1);
    do crypto.getRandomValues(a); while (a[0] >= lim);
    return a[0] % max;
  }
  function genPassword(len, sets) {
    const pools = { l: "abcdefghijkmnopqrstuvwxyz", u: "ABCDEFGHJKLMNPQRSTUVWXYZ", d: "23456789", s: "!@#$%^&*-_=+?" };
    const chosen = Object.keys(pools).filter((k) => sets[k]);
    if (!chosen.length) chosen.push("l");
    const all = chosen.map((k) => pools[k]).join("");
    const out = chosen.map((k) => pools[k][randInt(pools[k].length)]); // har turdan kamida bittadan
    while (out.length < len) out.push(all[randInt(all.length)]);
    for (let i = out.length - 1; i > 0; i--) { const j = randInt(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
    return out.join("");
  }
  const WEAK = ["password", "qwerty", "123456", "parol", "salom", "admin", "iloveyou", "uzbekistan", "toshkent"];
  function strength(pw) {
    let cs = 0;
    if (/[a-z]/.test(pw)) cs += 26; if (/[A-Z]/.test(pw)) cs += 26; if (/\d/.test(pw)) cs += 10; if (/[^A-Za-z0-9]/.test(pw)) cs += 33;
    let bits = pw.length * Math.log2(cs || 1);
    if (WEAK.some((w) => pw.toLowerCase().includes(w))) bits -= 30;
    if (/(.)\1{2,}/.test(pw)) bits -= 10;
    return Math.max(0, Math.round(bits));
  }

  // ---------- Holat (faqat xotirada) ----------
  let S = null; // { key, salt, iter, data: {entries: [...]}} — faqat seyf ochiq bo'lganda
  let filter = "all", query = "", editing = null, panel = null, idleTimer = null, hiddenTimer = null, lockAt = 0, tickTimer = null;
  let downloads = null;
  try { window.claude?.use?.("downloads").then((d) => { downloads = d; }).catch(() => {}); } catch {}

  const root = document.getElementById("viewVault");
  const lessonsView = document.getElementById("viewLessons");
  const toggleBtn = document.getElementById("vaultBtn");

  function toast(msg, kind = "") {
    const t = h("div", { class: "toast " + kind, role: "status", text: msg });
    document.body.append(t); setTimeout(() => t.remove(), 3200);
  }

  // ---------- Ko'rinishlarni almashtirish ----------
  function showVault(on) {
    root.hidden = !on; lessonsView.hidden = on;
    toggleBtn.setAttribute("aria-pressed", on);
    toggleBtn.querySelector("span").textContent = t(on ? "vault_close" : "vault_open");
    try { history.replaceState(null, "", on ? "#seyf" : "#" + (window.__lessonId?.() || "")); } catch {}
    if (on) render();
    window.scrollTo({ top: 0 });
  }
  toggleBtn.addEventListener("click", () => showVault(root.hidden));

  // ---------- Urinishlar cheklovi ----------
  function fails() { try { return JSON.parse(store.get(FAILS)) || { n: 0, until: 0 }; } catch { return { n: 0, until: 0 }; } }
  function addFail() {
    const f = fails(); f.n++;
    if (f.n >= 3) f.until = Date.now() + Math.min(5 * 2 ** (f.n - 3), 300) * 1000;
    store.set(FAILS, JSON.stringify(f)); return f;
  }

  // ---------- Avto-qulf ----------
  function armIdle() {
    if (!S) return;
    clearTimeout(idleTimer); lockAt = Date.now() + IDLE_MS;
    idleTimer = setTimeout(() => lock(t("v_idle_locked")), IDLE_MS);
  }
  ["pointerdown", "keydown", "input"].forEach((e) => document.addEventListener(e, () => S && armIdle(), { passive: true }));
  document.addEventListener("visibilitychange", () => {
    if (!S) return;
    if (document.hidden) hiddenTimer = setTimeout(() => lock(t("v_hidden_locked")), HIDDEN_MS);
    else clearTimeout(hiddenTimer);
  });
  function lock(msg) {
    S = null; editing = null; query = "";
    clearTimeout(idleTimer); clearTimeout(hiddenTimer); clearInterval(tickTimer);
    if (msg) toast(msg);
    render();
  }

  async function persist() {
    const blob = await seal(S.key, S.salt, S.iter, S.data);
    if (!store.set(STORE, JSON.stringify(blob))) toast(t("v_write_fail"), "bad");
    return blob;
  }
  function meta() { try { return JSON.parse(store.get(META)) || {}; } catch { return {}; } }

  // ---------- Umumiy UI bo'laklari ----------

      S.key = await deriveKey(p, salt, ITER); S.salt = salt; S.iter = ITER;
      await persist(); render();
      toast(t("v_changed"), "good");
    } }, h("h3", { text: t("v_change") }), cur.wrap, a.wrap, m, b.wrap, err,
      h("div", { class: "row" }, btn, h("button", { type: "button", class: "btn ghost", text: t("v_cancel"), onclick: render }))));
  }

  function viewWipe() {
    const inp = h("input", { type: "text", id: "wipe", autocomplete: "off" });
    const err = h("div", { class: "err-line", role: "alert" });
    root.replaceChildren(h("form", { class: "vcard", onsubmit: (e) => {
      e.preventDefault();
      if (inp.value.trim() !== t("v_wipe_word")) return (err.textContent = t("v_wipe_type", { w: t("v_wipe_word") }));
      store.del(STORE); store.del(FAILS); store.del(META); lock(); toast(t("v_wiped"));
    } }, h("h3", { text: t("v_wipe") }),
      h("div", { class: "vnote bad", text: t("v_wipe_warn") }),
      h("div", { class: "field" }, h("label", { for: "wipe", text: t("v_wipe_label", { w: t("v_wipe_word") }) }), inp), err,
      h("div", { class: "row" }, h("button", { type: "submit", class: "btn danger-solid", text: t("v_wipe_btn") }), h("button", { type: "button", class: "btn ghost", text: t("v_cancel"), onclick: render }))));
  }

  // ---------- Render ----------
  function render() {
    const noStore = !store.ok();
    const warn = noStore ? h("div", { class: "vnote bad", text: t("v_no_storage") }) : null;
    const hasVault = !!store.get(STORE);
    const content = S ? viewOpen() : hasVault ? viewLocked() : viewSetup();
    root.replaceChildren(h("div", { class: "vault" }, warn, content));
  }

  function lockSvg(size) {
    const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("width", size); svg.setAttribute("height", size);
    svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    const r = document.createElementNS(ns, "rect"); [["x", 4], ["y", 11], ["width", 16], ["height", 10], ["rx", 2]].forEach(([k, v]) => r.setAttribute(k, v));
    const p = document.createElementNS(ns, "path"); p.setAttribute("d", "M8 11V7a4 4 0 0 1 8 0v4");
    svg.append(r, p); return svg;
  }

  if (!window.crypto?.subtle) {
    toggleBtn.addEventListener("click", () => root.replaceChildren(h("div", { class: "vnote bad", text: t("v_no_crypto") })));
  }
  // Til o'zgarsa: seyf holati (ochiq/qulf) saqlanadi, faqat matnlar qayta chiziladi.
  // Ochiq tahrirlash formasi yopiladi, chunki kiritilgan matn qayta chizishda yo'qolardi.
  langListeners.push(() => { toggleBtn.querySelector("span").textContent = t(root.hidden ? "vault_open" : "vault_close"); if (!root.hidden) render(); });
  toggleBtn.querySelector("span").textContent = t("vault_open");
  if (location.hash === "#seyf") showVault(true);
})();

// ================= DARAJA PANELI: streak, yutuqlar, daraja, CTF =================
// engine.js dan keyin ulanadi (bir xil scope): state, saveState, LESSONS, LX, t, esc, langListeners, $ mavjud.
(() => {
  const dash = document.getElementById("viewDash");
  const dashBtn = document.getElementById("dashBtn");
  const vaultBtn = document.getElementById("vaultBtn");
  const lessonsView = document.getElementById("viewLessons");
  const vaultView = document.getElementById("viewVault");
  if (!dash || !dashBtn) return;

  // --- Holatni kengaytirish (eski progress bilan mos) ---
  state.streak = state.streak || { count: 0, lastDay: null };
  state.ctf = state.ctf || { solved: [] };
  state.badges = state.badges || [];
  state.langs = state.langs || [];

  const todayStr = () => new Date().toISOString().slice(0, 10);
  const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

  // --- Streak (kunlik seriya) — sahifa ochilganda yangilanadi ---
  function touchStreak() {
    const t0 = todayStr(), last = state.streak.lastDay;
    if (last === t0) return;
    if (last && dayDiff(last, t0) === 1) state.streak.count += 1;
    else state.streak.count = 1;
    state.streak.lastDay = t0;
    saveState();
  }
  // Faqat dars/CTF tugatilganda streak "faol kun" bo'lib hisoblansin — shuning uchun
  // touchStreak() ni yutuq (dars/CTF) paytida chaqiramiz, oddiy ochishda emas.

  function markLang() { if (!state.langs.includes(LANG)) { state.langs.push(LANG); saveState(); } }

  // --- CTF mashqlari ---
  const CTF = [
    { id: "b64", pts: 10, ans: "flag{base64_oson}" },
    { id: "rot13", pts: 10, ans: "flag{sezar_shifri}" },
    { id: "hex", pts: 15, ans: "flag{hex_kod}" },
    { id: "url", pts: 15, ans: "account-verify.top" },
    { id: "hash", pts: 20, ans: "md5" },
    { id: "binary", pts: 20, ans: "flag{bit_va_bayt}" },
  ];
  const ctfDone = (id) => state.ctf.solved.includes(id);
  function solveCtf(id) {
    if (ctfDone(id)) return;
    state.ctf.solved.push(id); touchStreak(); saveState(); checkBadges(); renderDash();
  }

  // --- Yutuqlar (badges) ---
  const BADGES = [
    { id: "first_lesson", icon: "🎯", cond: () => doneCount() >= 1 },
    { id: "half_month", icon: "⚡", cond: () => doneCount() >= 5 },
    { id: "month1", icon: "🏅", cond: () => doneCount() >= 10 },
    { id: "first_flag", icon: "🚩", cond: () => state.ctf.solved.length >= 1 },
    { id: "ctf_master", icon: "👑", cond: () => state.ctf.solved.length >= CTF.length },
    { id: "streak3", icon: "🔥", cond: () => state.streak.count >= 3 },
    { id: "streak7", icon: "💪", cond: () => state.streak.count >= 7 },
    { id: "polyglot", icon: "🌐", cond: () => state.langs.length >= 3 },
    { id: "perfect", icon: "✨", cond: () => doneCount() >= 3 },
  ];
  function doneCount() { const ids = new Set(LESSONS.map((l) => l.id)); return state.done.filter((d) => ids.has(d)).length; }
  function checkBadges() {
    let gained = false;
    for (const b of BADGES) if (b.cond() && !state.badges.includes(b.id)) { state.badges.push(b.id); gained = true; if (typeof toastMsg === "function") {} }
    if (gained) saveState();
  }

  // --- Daraja (level) — ballardan hisoblanadi ---
  function points() {
    return doneCount() * 10 + state.ctf.solved.reduce((s, id) => s + (CTF.find((c) => c.id === id)?.pts || 0), 0) + state.badges.length * 5;
  }
  const LEVELS = [0, 30, 80, 160, 280, 420]; // 6 daraja chegarasi
  function levelInfo() {
    const p = points();
    let lv = 0; for (let i = 0; i < LEVELS.length; i++) if (p >= LEVELS[i]) lv = i;
    const next = LEVELS[lv + 1];
    const pct = next ? Math.round(((p - LEVELS[lv]) / (next - LEVELS[lv])) * 100) : 100;
    return { lv, p, next, pct };
  }

  // --- Ko'rinishlarni almashtirish ---
  function showDash(on) {
    dash.hidden = !on; lessonsView.hidden = on;
    if (on && vaultView) { vaultView.hidden = true; if (vaultBtn) { vaultBtn.setAttribute("aria-pressed", "false"); const sp = vaultBtn.querySelector("span"); if (sp) sp.textContent = t("vault_open"); } }
    dashBtn.setAttribute("aria-pressed", on);
    dashBtn.querySelector("span").textContent = t(on ? "dash_close" : "dash_open");
    try { history.replaceState(null, "", on ? "#daraja" : "#" + (window.__lessonId?.() || "")); } catch {}
    if (on) { markLang(); checkBadges(); renderDash(); window.scrollTo({ top: 0 }); }
  }
  dashBtn.addEventListener("click", () => showDash(dash.hidden));
  if (vaultBtn) vaultBtn.addEventListener("click", () => { if (!dash.hidden) { dash.hidden = true; dashBtn.setAttribute("aria-pressed", "false"); dashBtn.querySelector("span").textContent = t("dash_open"); } });

  // --- Dashboard render ---
  function renderDash() {
    if (dash.hidden) return;
    const { lv, p, next, pct } = levelInfo();
    const levels = t("d_levels");
    const done = doneCount(), total = LESSONS.length;
    const stat = (label, val, sub) => `<div class="dstat"><span>${esc(label)}</span><b>${esc(String(val))}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;

    const badgesHtml = BADGES.map((b) => {
      const got = state.badges.includes(b.id);
      const info = t("d_badges")[b.id] || { t: b.id, d: "" };
      return `<div class="badge ${got ? "got" : "locked"}" title="${esc(info.d)}">
        <span class="bico">${got ? b.icon : "🔒"}</span>
        <span class="bname">${esc(info.t)}</span>
        <span class="bdesc">${esc(info.d)}</span></div>`;
    }).join("");

    const ctfHtml = CTF.map((c) => {
      const solved = ctfDone(c.id);
      const q = t("d_ctf")[c.id];
      return `<div class="ctf ${solved ? "solved" : ""}" data-ctf="${c.id}">
        <div class="ctf-head"><b>${esc(q.t)}</b><span class="ctf-pts">${solved ? "✓ " : ""}${c.pts} ${t("d_pts")}</span></div>
        <p class="ctf-q">${q.body}</p>
        ${solved ? `<div class="fb ok">${esc(t("d_ctf_solved"))}</div>` : `
          <div class="row"><input type="text" class="ctf-in" placeholder="${esc(t("d_ctf_ph"))}" spellcheck="false">
          <button type="button" class="btn ctf-go">${esc(t("b_check"))}</button></div>
          <div class="ctf-fb"></div>`}
      </div>`;
    }).join("");

    dash.innerHTML = `<div class="dash">
      <div class="dhero">
        <div class="dlevel">
          <div class="dlv-ring" style="--pct:${pct}"><span>${lv + 1}</span></div>
          <div>
            <div class="dlv-name">${esc(levels[lv])}</div>
            <div class="dlv-sub">${next ? esc(t("d_to_next", { n: next - p })) : esc(t("d_maxed"))}</div>
            <div class="bar dlv-bar"><i style="width:${pct}%"></i></div>
          </div>
        </div>
      </div>
      <div class="dstats">
        ${stat(t("d_streak"), "🔥 " + state.streak.count, t("d_days"))}
        ${stat(t("d_lessons"), done + " / " + total, "")}
        ${stat(t("d_ctf_solved_n"), state.ctf.solved.length + " / " + CTF.length, "")}
        ${stat(t("d_points"), p, "")}
        ${stat(t("d_badges_n"), state.badges.length + " / " + BADGES.length, "")}
      </div>

      <h3 class="dh">${esc(t("d_badges_h"))}</h3>
      <div class="badges">${badgesHtml}</div>

      <h3 class="dh">${esc(t("d_ctf_h"))}</h3>
      <p class="labnote">${esc(t("d_ctf_note"))}</p>
      <div class="ctflist">${ctfHtml}</div>

      <div class="pager"><button type="button" class="btn ghost" id="dashBack">${esc(t("d_back"))}</button></div>
    </div>`;

    dash.querySelectorAll(".ctf").forEach((el) => {
      const id = el.dataset.ctf, c = CTF.find((x) => x.id === id);
      const go = el.querySelector(".ctf-go"); if (!go) return;
      const inp = el.querySelector(".ctf-in"), fb = el.querySelector(".ctf-fb");
      const check = () => {
        const val = inp.value.trim().toLowerCase().replace(/\s+/g, "");
        const ok = val === c.ans.toLowerCase().replace(/\s+/g, "");
        if (ok) { solveCtf(id); }
        else { fb.innerHTML = `<div class="fb no">${esc(t("d_ctf_wrong"))}</div>`; }
      };
      go.addEventListener("click", check);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
    });
    $("#dashBack", dash).addEventListener("click", () => showDash(false));
  }

  // Dars tugatilganda (quiz) streak va badge yangilanishi uchun engine'ni o'raymiz:
  // renderQuiz done qo'shganda saveState chaqiradi — biz state.done ni kuzatamiz.
  const origSave = saveState;
  let lastDone = state.done.length;
  window.__afterSave = () => {};
  // Har render/quizdan keyin tekshirish uchun davriy emas — quiz to'g'ridan-to'g'ri done push qiladi.
  // engine renderQuiz ichida state.done.push + saveState bor; shuni ushlash uchun saveState'ni o'raymiz.
  try {
    // eslint-disable-next-line no-global-assign
    saveState = function () { origSave(); if (state.done.length > lastDone) { lastDone = state.done.length; touchStreak(); checkBadges(); } };
  } catch {}

  langListeners.push(() => { if (!dash.hidden) renderDash(); dashBtn.querySelector("span").textContent = t(dash.hidden ? "dash_open" : "dash_close"); });

  // Boshlang'ich: badge holatini tekshir, til belgisi
  markLang(); checkBadges();
  if (location.hash === "#daraja") showDash(true);
})();

// Barcha modullar (labs2 ham) yuklangach, birinchi renderni chaqiramiz.
renderNav(); renderProgress(); renderLesson();

// ================= KIBER FON: tarmoq/konstellatsiya effekti =================
// Canvas generativ animatsiya. Sarlavha ortida bir-biriga ulanadigan nuqtalar suzadi.
// prefers-reduced-motion bo'lsa harakatsiz, faqat statik naqsh chiziladi.
(() => {
  const canvas = document.getElementById("bgfx");
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
  let nodes = [], raf = null;

  // Joriy mavzuning urg'u rangini olamiz (light/dark ikkalasida ishlaydi)
  function accent() {
    const c = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    return c || "#2f5bea";
  }
  function isDark() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t === "dark") return true;
    if (t === "light") return false;
    return matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function resize() {
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Nuqtalar soni ekran o'lchamiga qarab (juda ko'p bo'lmasin)
    const target = Math.min(70, Math.round((W * H) / 22000));
    nodes = [];
    for (let i = 0; i < target; i++) {
      nodes.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.6 + 0.8,
      });
    }
  }

  function draw() {
    const col = accent();
    const dark = isDark();
    const lineBase = dark ? 0.22 : 0.16;   // chiziqlar shaffofligi
    const dotBase = dark ? 0.55 : 0.4;
    ctx.clearRect(0, 0, W, H);
    // Yuqori qismda (sarlavha atrofida) effekt kuchliroq, pastga tomon so'nadi
    const fade = (y) => Math.max(0, 1 - y / (H * 0.85));

    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < 130 * 130) {
          const o = (1 - Math.sqrt(d2) / 130) * lineBase * fade((a.y + b.y) / 2);
          if (o <= 0.003) continue;
          ctx.strokeStyle = col; ctx.globalAlpha = o; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const n of nodes) {
      ctx.fillStyle = col; ctx.globalAlpha = dotBase * fade(n.y);
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function step() {
    for (const n of nodes) {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
    }
    draw();
    raf = requestAnimationFrame(step);
  }

  function start() {
    resize();
    if (raf) cancelAnimationFrame(raf);
    if (reduce) draw(); else step();
  }

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(start, 200); }, { passive: true });
  // Mavzu o'zgarsa (toggle) rang yangilanishi uchun katamiz
  new MutationObserver(() => { if (reduce) draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  // Sahifa ko'rinmasa animatsiyani to'xtatamiz (batareya/tejamkorlik)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
    else if (!reduce && !raf) step();
  });
  start();
})();

</script>
